name: CSMS Continuous Integration & Delivery

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  lint-commit-standards:
    name: 📜 Lint Commit Messages & PR Titles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Validate PR Title & Commits
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to ${{ github.event.pull_request.head.sha || 'HEAD' }} --verbose

  code-quality:
    name: 🛡️ Quality & Security Audits
    runs-on: ubuntu-latest
    needs: lint-commit-standards
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test-suite:
    name: 🧪 Automated Test Suite (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Native Node.js Test Runner
        run: npm test

  build-and-release:
    name: 📦 Package Release & Artifacts
    runs-on: ubuntu-latest
    needs: test-suite
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Production Dependencies
        run: npm ci --only=production || npm install --omit=dev

      - name: Create Production Bundle Artifact
        run: |
          mkdir -p build
          tar -czf build/csms-app-release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='test' \
            .

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csms-production-build
          path: build/csms-app-release.tar.gz
          retention-days: 14
